<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RYOSEIWORLD RPG</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#1a1040">
<style>
  html, body {
    margin: 0; padding: 0; background: #000; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, -apple-system, sans-serif;
    height: 100%; width: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #outer {
    position: fixed; inset: 0;
    background: #000;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 540px; height: 960px;
    transform-origin: 0 0;
    background: #0c0820;
    overflow: hidden;
  }
  canvas#game {
    position: absolute; top: 0; left: 0;
    width: 540px; height: 960px;
    image-rendering: pixelated;
  }
  .screen {
    position: absolute; inset: 0;
    display: none;
  }
  .screen.active { display: block; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #6cf; font-size: 20px; letter-spacing: 2px; background: #000;
    z-index: 50;
  }

  /* タイトル */
  #screen-title { display: none; align-items: center; justify-content: center; flex-direction: column; }
  #screen-title.active { display: flex; }
  .title-logo { font-size: 52px; font-weight: bold; letter-spacing: 3px; color: #fff; text-shadow: 0 0 18px #5cf; }
  .title-sub { margin-top: 60px; font-size: 26px; color: #6cf; }
  .blink { animation: blink 1.1s infinite; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0.15;} }

  /* 会話シーン共通 */
  .adv-art { position: absolute; top: 60px; left: 0; width: 540px; height: 560px; }
  .speaker-name {
    position: absolute; left: 24px; top: 636px;
    font-size: 22px; color: #6cf; font-weight: bold;
  }
  .dialogue-box {
    position: absolute; left: 20px; right: 20px; bottom: 40px;
    min-height: 190px;
    background: rgba(6,4,20,0.92);
    border: 3px solid #6cf;
    border-radius: 10px;
    padding: 24px 22px;
    box-sizing: border-box;
    font-size: 26px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .tap-hint {
    position: absolute; right: 30px; bottom: 52px;
    font-size: 22px; color: #6cf;
  }

  /* 命名 */
  #screen-naming { align-items: center; justify-content: center; flex-direction: column; }
  #screen-naming.active { display: flex; }
  .naming-label { font-size: 26px; margin-bottom: 30px; line-height: 1.7; text-align: center; }
  #name-input {
    font-size: 30px; padding: 12px 18px; width: 260px; text-align: center;
    background: #10142a; color: #fff; border: 3px solid #6cf; border-radius: 8px;
  }
  .name-confirm-btn {
    margin-top: 34px; font-size: 26px; padding: 14px 40px;
    background: #6cf; color: #0c0820; border: none; border-radius: 8px; font-weight: bold;
  }

  /* 戦闘 */
  #screen-battle.active { display: block; }
  .hp-panel {
    position: absolute; background: rgba(6,4,20,0.85); border: 2px solid #6cf; border-radius: 8px;
    padding: 8px 14px; font-size: 22px; line-height: 1.5;
  }
  #hp-boss { top: 44px; left: 20px; }
  #hp-ryosei { top: 560px; right: 20px; }
  #battle-log {
    position: absolute; left: 20px; right: 20px; top: 648px; height: 92px;
    background: rgba(6,4,20,0.92); border: 3px solid #6cf; border-radius: 10px;
    padding: 12px 18px; box-sizing: border-box; font-size: 22px; line-height: 1.4; white-space: pre-wrap;
    overflow: hidden;
  }
  #command-menu {
    position: absolute; left: 20px; right: 20px; bottom: 20px; height: 190px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8px;
  }
  .cmd-btn {
    font-size: 26px; background: #10142a; color: #fff; border: 3px solid #6cf; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .cmd-btn.disabled { color: #444; border-color: #333; }
  .burst-text {
    position: absolute; left: 0; right: 0; top: 300px; text-align: center;
    font-size: 26px; color: #ff6; text-shadow: 0 0 10px #ff0, 2px 2px 0 #000;
    padding: 0 30px; opacity: 0; pointer-events: none; line-height: 1.5;
  }
  .burst-text.show { opacity: 1; transition: opacity 0.15s; }
  .burst-text.hide { opacity: 0; transition: opacity 0.6s; }

  #screen-epilogue.active { display: block; }
  #epilogue-speaker { top: 590px; }
  #epilogue-box { min-height: 250px; }
  .answer-row { display: flex; gap: 10px; margin-top: 16px; }
  .answer-row input {
    flex: 1; font-size: 22px; padding: 10px 12px;
    background: #10142a; color: #fff; border: 2px solid #6cf; border-radius: 6px;
  }
  .answer-row button {
    font-size: 22px; padding: 10px 20px; background: #6cf; color: #0c0820;
    border: none; border-radius: 6px; font-weight: bold;
  }

  .speaker-name, .tap-hint, .hp-panel, #battle-log,
  .answer-row input, .answer-row button { font-size: 24px; }
  .title-action { margin-top: 20px; min-width: 320px; font-size: 26px;
    padding: 14px; background: #10142a; color: #fff; border: 2px solid #6cf; border-radius: 8px; }
  button:disabled { color: #777; border-color: #444; }
  #chapter-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  #chapter-list[hidden], [hidden] { display: none !important; }
  #chapter-list button { margin: 0; }
  #hp-ryosei { top: 514px; }
  #battle-log { top: 578px; height: 166px; overflow-wrap: anywhere; }
  #command-menu.expanded { grid-template-rows: repeat(4, 1fr); }
  #item-menu { position: absolute; left: 20px; right: 20px; bottom: 20px;
    height: 190px; background: #10142a; border: 3px solid #6cf; border-radius: 8px;
    box-sizing: border-box; padding: 12px; font-size: 24px; text-align: center; }
  #item-menu button { font-size: 26px; padding: 12px 28px; margin: 12px; }
  #weakness { position: absolute; top: 140px; left: 20px; right: 20px;
    padding: 12px; background: rgba(6,4,20,.92); border: 2px solid #6cf;
    border-radius: 8px; font-size: 24px; white-space: pre-wrap; line-height: 1.45; }
  .answer-row input { min-width: 0; width: 0; }
  .answer-row button { flex-shrink: 0; }
  .naming-label { white-space: pre-line; }
  #epilogue-speaker { top: 560px; }
  #epilogue-box { min-height: 290px; white-space: normal; }
  #epilogue-text { white-space: pre-wrap; }
  #epilogue-tap-hint { pointer-events: none; }
  #stage.paused * { animation-play-state: paused !important; transition: none !important; }
</style>
</head>
<body>
<div id="outer">
  <div id="stage">
    <canvas id="game" width="540" height="960"></canvas>

    <div id="screen-title" class="screen active">
      <div class="title-logo">RYOSEIWORLD</div>
      <button class="title-sub title-action blink" id="start-btn">TAP TO START</button>
      <button class="title-action" id="continue-btn" disabled>つづきから</button>
      <button class="title-action" id="chapters-btn">しょうを えらぶ</button>
      <div id="chapter-list" hidden></div>
    </div>

    <div id="screen-prologue" class="screen">
      <div class="speaker-name" id="prologue-speaker"></div>
      <div class="dialogue-box" id="prologue-text"></div>
      <div class="tap-hint">▶</div>
    </div>

    <div id="screen-interlude" class="screen">
      <div class="speaker-name" id="interlude-speaker"></div>
      <div class="dialogue-box" id="interlude-text"></div>
      <div class="tap-hint">▶</div>
    </div>

    <div id="screen-naming" class="screen">
      <div class="naming-label">あおい ひかりが&#10;なまえを きいている&#10;なまえを つけてあげよう</div>
      <input id="name-input" type="text" maxlength="6" value="ソラ">
      <button class="name-confirm-btn" id="naming-confirm">けってい</button>
    </div>

    <div id="screen-battle" class="screen">
      <div class="hp-panel" id="hp-boss"><span id="boss-name-label">BUG KING</span><br>HP <span id="boss-hp-num">32</span> / <span id="boss-max-hp">32</span></div>
      <div class="hp-panel" id="hp-ryosei"><span id="ryosei-name-label">RYOSEI</span> HP <span id="ryosei-hp-num">30</span> / <span id="ryosei-max-hp">30</span></div>
      <div class="burst-text" id="burst-text"></div>
      <div id="battle-log">たたかいが はじまった!</div>
      <div id="weakness" hidden></div>
      <div id="command-menu">
        <button class="cmd-btn" data-cmd="tatakau">たたかう</button>
        <button class="cmd-btn" data-cmd="tsukuru">つくる</button>
        <button class="cmd-btn" data-cmd="naosu">なおす</button>
        <button class="cmd-btn" data-cmd="nigeru">にげる</button>
        <button class="cmd-btn" data-cmd="dougu" hidden>どうぐ</button>
        <button class="cmd-btn disabled" data-cmd="shiraberu">しらべる</button>
        <button class="cmd-btn disabled" data-cmd="tsutaeru">つたえる</button>
      </div>
    </div>

    <div id="item-menu" hidden>
      <div>はじめて つくった ゲーム</div>
      <button id="item-show">みせる</button><button id="item-back">もどる</button>
    </div>

    <div id="screen-epilogue" class="screen">
      <div class="speaker-name" id="epilogue-speaker"></div>
      <div class="dialogue-box" id="epilogue-box">
        <div id="epilogue-text"></div>
        <div class="answer-row" id="epilogue-answer-row" style="display:none;">
          <input id="epilogue-answer-input" type="text" maxlength="16" placeholder="こたえる">
          <button id="epilogue-answer-btn">こたえる</button>
        </div>
      </div>
      <div class="tap-hint" id="epilogue-tap-hint">▶</div>
    </div>
  </div>
</div>
<div id="loading">LOADING...</div>

<script>
(function () {
  'use strict';

  // ============ 定数 ============
  var LOGICAL_W = 540, LOGICAL_H = 960;
  var RYOSEI_MAX_HP = 30;
  var BUGKING_MAX_HP = 32;
  var ROLL_STEP = 0.045; // 1目盛りあたりの秒数

  // Platform adapter: only this object touches storage / visibility / audio policy.
  var platform = (function () {
    var pauseCallbacks = [], resumeCallbacks = [];
    try {
      document.addEventListener('visibilitychange', function () {
        (document.hidden ? pauseCallbacks : resumeCallbacks).forEach(function (cb) {
          try { cb(); } catch (_) { /* A host callback must not stop the game. */ }
        });
      });
    } catch (_) {}
    return {
      save: async function (obj) {
        try { localStorage.setItem('ryoseiworld-rpg-v4', JSON.stringify(obj)); } catch (_) {}
      },
      load: async function () {
        try { return JSON.parse(localStorage.getItem('ryoseiworld-rpg-v4')); } catch (_) { return null; }
      },
      onPause: function (cb) {
        pauseCallbacks.push(cb);
        try { if (document.hidden) queueMicrotask(cb); } catch (_) {}
      },
      onResume: function (cb) { resumeCallbacks.push(cb); },
      isAudioEnabled: function () { return true; },
      onAudioChange: function (cb) { try { cb(true); } catch (_) {} },
      firstFrameReady: function () {},
      gameReady: function () {}
    };
  })();
  var paused = false, gameTime = 0, scheduled = [], timerId = 0;
  function later(cb, ms) { scheduled.push({ id: ++timerId, at: gameTime + ms, cb: cb }); }
  function tickTimers() {
    var due = scheduled.filter(function (task) { return task.at <= gameTime; });
    due.forEach(function (task) {
      // A transition can cancel the rest of this frame's pending callbacks.
      if (scheduled.indexOf(task) < 0) return;
      scheduled.splice(scheduled.indexOf(task), 1);
      task.cb();
    });
  }
  function syncAudio() {
    try {
      if (!audioCtx) return;
      var action = paused || !platform.isAudioEnabled() ? 'suspend' : 'resume';
      var result = audioCtx[action]();
      if (result && result.catch) result.catch(function () {});
    } catch (_) {}
  }
  platform.onPause(function () { paused = true; game.paused = true; stage.classList.add('paused'); syncAudio(); });
  platform.onResume(function () { paused = false; game.paused = false; lastT = null; stage.classList.remove('paused'); syncAudio(); });
  platform.onAudioChange(syncAudio);

  // ============ 乱数（?seed= で再現可能） ============
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var qs = new URLSearchParams(location.search);
  var seedParam = qs.get('seed');
  var rand = seedParam !== null ? mulberry32(parseInt(seedParam, 10) || 1) : Math.random;
  function randInt(min, max) { return Math.floor(rand() * (max - min + 1)) + min; }

  // ============ ステージのフィット ============
  var stage = document.getElementById('stage');
  function resizeStage() {
    var availW = window.innerWidth, availH = window.innerHeight;
    var scale = Math.min(availW / LOGICAL_W, availH / LOGICAL_H);
    var offX = (availW - LOGICAL_W * scale) / 2;
    var offY = (availH - LOGICAL_H * scale) / 2;
    stage.style.transform = 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
  }
  window.addEventListener('resize', resizeStage);
  window.addEventListener('orientationchange', resizeStage);
  resizeStage();

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ============ アセット読み込み（index.htmlの方式を流用） ============
  var ryoseiFrames = {};
  var bugkingFrames = {};
  var kateinoFrames = {}, hikakuFrames = {};
  async function loadFramesJson(dir, jsonFile, targetMap) {
    try {
      var response = await fetch(dir + '/' + jsonFile);
      if (!response.ok) return;
      var list = await response.json();
      if (!Array.isArray(list)) return;
      await Promise.all(list.map(function (f) {
        // slice_sheet.py emits plain filenames; never follow external or parent paths.
        if (!/^[a-zA-Z0-9_-]+\.png$/.test(f.file)) return;
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () { targetMap[f.row + '_' + f.col] = { img: img, w: f.w, h: f.h }; resolve(); };
          img.onerror = resolve;
          img.src = dir + '/' + f.file;
        });
      }));
    } catch (_) { /* Missing optional art uses the canvas fallback. */ }
  }
  async function loadOptionalFrames(name, targetMap, listing) {
    // Python's static server supplies directory listings. Check them first so an
    // unfinished artist directory does not generate missing-resource errors.
    // Hosts without listings can serve the JSON at the same fixed asset path.
    try {
      if (listing !== null) {
        if (!listing.includes('href="' + name + '/"')) return;
        var res = await fetch('assets/' + name + '/');
        if (res.ok) {
          var html = await res.text();
          if (html.includes('Directory listing for') && !html.includes(name + '_frames.json')) return;
        }
      }
      await loadFramesJson('assets/' + name, name + '_frames.json', targetMap);
    } catch (_) {}
  }
  async function boot() {
    var listing = null;
    try {
      var res = await fetch('assets/');
      if (res.ok) {
        var html = await res.text();
        if (html.includes('Directory listing for')) listing = html;
      }
    } catch (_) {}
    await Promise.all([
      loadFramesJson('assets/ryosei', 'ryosei_frames.json', ryoseiFrames),
      loadFramesJson('assets/bugking', 'bugking_frames.json', bugkingFrames),
      loadOptionalFrames('kateino', kateinoFrames, listing),
      loadOptionalFrames('hikaku', hikakuFrames, listing),
      loadProgress()
    ]);
    game.assets = { kateino: Object.keys(kateinoFrames).length > 0, hikaku: Object.keys(hikakuFrames).length > 0 };
    document.getElementById('loading').style.display = 'none';
    renderTitle();
    platform.firstFrameReady();
    requestAnimationFrame(loop);
    platform.gameReady();
  }

  // ============ WebAudio 効果音 ============
  var audioCtx = null;
  function ensureAudio() {
    try {
      if (paused || !platform.isAudioEnabled()) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      syncAudio();
    } catch (_) {}
  }
  function playTone(freq, duration, type, gainVal, freqEnd) {
    if (!audioCtx || paused || !platform.isAudioEnabled()) return;
    try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal || 0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (_) {}
  }
  var sfx = {
    decide: function () { playTone(560, 0.11, 'sine', 0.11, 780); },
    attack: function () { playTone(300, 0.12, 'sawtooth', 0.18, 100); },
    hurt: function () { playTone(140, 0.2, 'triangle', 0.22, 50); },
    heal: function () { playTone(500, 0.2, 'sine', 0.18, 800); },
    victory: function () {
      playTone(523, 0.15, 'square', 0.2);
      later(function () { playTone(659, 0.15, 'square', 0.2); }, 150);
      later(function () { playTone(784, 0.3, 'square', 0.2); }, 300);
    }
  };

  // ============ アニメ定義（index.htmlと同一シート） ============
  var RYOSEI_ANIM = {
    idle: { row: 0, cols: [0, 1, 2, 3], fps: 6, loop: true },
    hurt: { row: 3, cols: [0, 1], fps: 8, loop: false },
    magic: { row: 2, cols: [0, 1, 2, 3], fps: 12, loop: false }
  };
  var BUGKING_ANIM = {
    idle: { row: 0, cols: [0, 1, 2], fps: 5, loop: true },
    attack: { row: 1, cols: [0, 1, 2], fps: 8, loop: false },
    hurt: { row: 2, cols: [0, 1], fps: 8, loop: false },
    defeated: { row: 2, cols: [2], fps: 1, loop: false }
  };
  function AnimPlayer(defs) { this.defs = defs; this.current = null; this.frameIndex = 0; this.timer = 0; this.finished = false; }
  AnimPlayer.prototype.play = function (name, restart) {
    if (this.current === name && !restart) return;
    this.current = name; this.frameIndex = 0; this.timer = 0; this.finished = false;
  };
  AnimPlayer.prototype.update = function (dt) {
    var def = this.defs[this.current]; if (!def) return;
    this.timer += dt;
    var frameDur = 1 / def.fps;
    while (this.timer >= frameDur) {
      this.timer -= frameDur; this.frameIndex++;
      if (this.frameIndex >= def.cols.length) {
        if (def.loop) this.frameIndex = 0;
        else { this.frameIndex = def.cols.length - 1; this.finished = true; }
      }
    }
  };
  AnimPlayer.prototype.getRowCol = function () {
    var def = this.defs[this.current]; if (!def) return { row: 0, col: 0 };
    return { row: def.row, col: def.cols[this.frameIndex] };
  };
  function drawFrame(map, row, col, cx, groundY, scale) {
    var entry = map[row + '_' + col];
    if (!entry || !entry.img.complete || !entry.img.naturalWidth) return;
    var w = entry.w * scale, h = entry.h * scale;
    ctx.drawImage(entry.img, cx - w / 2, groundY - h, w, h);
  }

  // ============ 画面管理 ============
  var screens = ['title', 'prologue', 'naming', 'battle', 'interlude', 'epilogue'];
  function showScreen(name) {
    screens.forEach(function (s) {
      document.getElementById('screen-' + s).classList.toggle('active', s === name);
    });
    game.screen = name;
    document.getElementById('item-menu').hidden = true;
    game.itemMenu = false;
  }

  // ============ デバッグ状態（外部公開） ============
  var game = {
    screen: 'title',
    chapter: 1, clearedChapter: 0, reachedChapter: 1, started: false, paused: false,
    unlockedCommands: [], saturation: 0, createCount: 0, wallTurns: 0,
    attackDown: 0, researched: false, nextAction: '', allyCount: 0, guaranteedCreate: false, guard: false,
    lastDamage: null, interludeIndex: 0, itemMenu: false,
    prologueIndex: 0,
    epilogueIndex: 0,
    epilogueStage: 'panels',
    aiName: 'ソラ',
    log: [],
    ryosei: { hp: RYOSEI_MAX_HP, maxHp: RYOSEI_MAX_HP, displayHp: RYOSEI_MAX_HP, rollTarget: RYOSEI_MAX_HP, rolling: false, rollTimer: 0 },
    boss: { hp: BUGKING_MAX_HP, maxHp: BUGKING_MAX_HP, displayHp: BUGKING_MAX_HP, rollTarget: BUGKING_MAX_HP, rolling: false, rollTimer: 0, enraged: false, turnCount: 0 },
    burstShown: {},
    battleOver: false,
    playerLocked: false
  };
  window.__rpg = game;
  game.platform = platform;
  var CHAPTERS = [null,
    { name: 'BUG KING', hp: BUGKING_MAX_HP, playerHp: RYOSEI_MAX_HP },
    { name: 'カテイノジジョウ', hp: 80, playerHp: 34 },
    { name: 'ヒカクマオウ', hp: 100, playerHp: 38 },
    { name: 'ジブン', hp: 1, playerHp: 38 }
  ];
  async function loadProgress() {
    var saved = await platform.load();
    if (!saved || saved.version !== 1) return;
    game.clearedChapter = Math.max(0, Math.min(4, Number(saved.clearedChapter) || 0)) | 0;
    game.reachedChapter = Math.max(Math.min(4, game.clearedChapter + 1), Math.min(4, Number(saved.reachedChapter) || 1)) | 0;
    game.started = saved.started === true;
    if (typeof saved.aiName === 'string' && saved.aiName.trim()) game.aiName = saved.aiName.trim().slice(0, 6);
  }
  function saveProgress() {
    platform.save({ version: 1, started: game.started, aiName: game.aiName,
      clearedChapter: game.clearedChapter, reachedChapter: game.reachedChapter });
  }
  function renderTitle() {
    document.getElementById('continue-btn').disabled = !game.started;
    document.getElementById('chapter-list').hidden = true;
    var list = document.getElementById('chapter-list');
    list.replaceChildren();

  function startRoll(entity, newTrueHp) {
    entity.hp = Math.max(0, Math.min(entity.maxHp, newTrueHp));
    entity.rollTarget = entity.hp;
    entity.rolling = true;
    entity.rollTimer = 0;
  }
  function updateRoll(entity, dt, onZero) {
    if (!entity.rolling) return;
    entity.rollTimer += dt;
    while (entity.rollTimer >= ROLL_STEP && entity.displayHp !== entity.rollTarget) {
      entity.rollTimer -= ROLL_STEP;
      entity.displayHp += (entity.rollTarget > entity.displayHp ? 1 : -1);
      if (entity.displayHp === entity.rollTarget) {
        entity.rolling = false;
        if (entity.displayHp <= 0 && onZero) onZero();
      }
    }
  }
  // なおす（回復）：ロール中でも目標値を引き上げて助かる
  function healEntity(entity, amount) {
    var newTrue = Math.min(entity.maxHp, entity.hp + amount);
    entity.hp = newTrue;
    entity.rollTarget = newTrue;
    if (!entity.rolling) entity.displayHp = newTrue;
    else entity.rolling = entity.displayHp !== newTrue; // 目標を上書きして継続
  }

  // ============ 文字送り（タイプライター・20文字/秒） ============
  var TYPE_SPEED = 20;
  var typewriter = { el: null, text: '', idx: 0, timer: 0, active: false, done: true, onDone: null };
  function startTypewriter(el, text, onDone) {
    typewriter.el = el; typewriter.text = text; typewriter.idx = 0; typewriter.timer = 0;
    typewriter.active = true; typewriter.done = false; typewriter.onDone = onDone || null;
    el.textContent = '';
  }
  function updateTypewriter(dt) {
    if (!typewriter.active || typewriter.done) return;
    typewriter.timer += dt;
    var step = 1 / TYPE_SPEED;
    while (typewriter.timer >= step && typewriter.idx < typewriter.text.length) {
      typewriter.timer -= step; typewriter.idx++;
      typewriter.el.textContent = typewriter.text.slice(0, typewriter.idx);
    }
    if (typewriter.idx >= typewriter.text.length && !typewriter.done) {
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
    }
  }
  function skipTypewriter() {
    if (typewriter.active && !typewriter.done) {
      typewriter.idx = typewriter.text.length;
      typewriter.el.textContent = typewriter.text;
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
      return true;
    }
    return false;
  }

  // ============ ソラの円描画 ============
  function drawSora(cx, cy, r, t) {
    var pulse = 1 + Math.sin(t * 3) * 0.08;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * pulse);
    grad.addColorStop(0, 'rgba(160,220,255,0.95)');
    grad.addColorStop(0.6, 'rgba(80,160,255,0.55)');
    grad.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2); ctx.fill();
  }

    document.getElementById('epilogue-answer-row').style.display = 'none';
    document.getElementById('epilogue-answer-input').value = '';
    game.epilogueStage = 'response';
    document.getElementById('epilogue-speaker').textContent = game.aiName;
    startTypewriter(document.getElementById('epilogue-text'), 'わかった。つくろう', function () {
      game.epilogueStage = 'glow';
      glowStart = gameTime;
      later(function () {
        game.epilogueStage = 'panels';
        gotoTitle();
      }, 3000);
    });
  });

  // ============ メインループ ============
  var ryoseiSprite = { anim: new AnimPlayer(RYOSEI_ANIM) };
  var bossSprite = { anim: new AnimPlayer(BUGKING_ANIM) };
  ryoseiSprite.anim.play('idle');
  bossSprite.anim.play('idle');

  var lastT = null, elapsed = 0;
  function loop(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    if (paused) { requestAnimationFrame(loop); return; }
    elapsed += dt; gameTime += dt * 1000;
    tickTimers();

    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (game.screen === 'prologue') {
      updateTypewriter(dt);
      var p = PROLOGUE[game.prologueIndex];
      drawAdvArt(p.art, elapsed);
    } else if (game.screen === 'interlude') {
      updateTypewriter(dt); drawNightRoom(elapsed);
      if (game.chapter === 2) drawOpenDoor();
      if (game.chapter === 3 && game.interludeIndex > 0) drawSelf(390, 460, 0, 1);
    } else if (game.screen === 'epilogue') {
      updateTypewriter(dt);
      drawNightRoom(elapsed);
      if (game.epilogueStage === 'glow' && glowStart !== null) {
        drawEndingGlow(gameTime - glowStart);
      }
    } else if (game.screen === 'battle') {
      drawBattleBg();
      updateRoll(game.boss, dt, onBossZero);
      updateRoll(game.ryosei, dt, onRyoseiZero);
      ryoseiSprite.anim.update(dt);
      bossSprite.anim.update(dt);
      var bRc = bossSprite.anim.getRowCol();
      drawEnemy(bRc);
      var rRc = ryoseiSprite.anim.getRowCol();
      drawFrame(ryoseiFrames, rRc.row, rRc.col, 140, 568, 0.6);
      drawSora(320, 480, 26, elapsed);
      if (game.chapter === 4 && game.ally && gameTime < game.ally.until) drawAlly();
      document.getElementById('boss-hp-num').textContent = game.chapter === 4 ? '—' : Math.max(0, game.boss.displayHp);
      document.getElementById('ryosei-hp-num').textContent = Math.max(0, game.ryosei.displayHp);
      if (victoryFlashStart !== null && game.chapter !== 4) drawVictoryFlash(gameTime - victoryFlashStart);
    }

    requestAnimationFrame(loop);
  }

  function drawAlly() {
    ctx.save();
    if (game.ally.index === 0) {
      ctx.fillStyle = '#5b3948'; ctx.fillRect(384, 384, 50, 52);
      ctx.fillStyle = '#edbe9c'; ctx.fillRect(390, 396, 38, 38);
      ctx.fillStyle = '#d78e77'; ctx.fillRect(376, 436, 66, 64);
      ctx.fillStyle = '#fff0c7'; ctx.fillRect(390, 440, 38, 48);
    } else if (game.ally.index === 1) {
      ctx.globalAlpha = 0.8;
      drawFrame(ryoseiFrames, 0, 0, 410, 505, 0.5);
    } else {
      // Repaired CRT: a bright, intact screen instead of the broken boss face.
      ctx.fillStyle = '#796680'; ctx.fillRect(365, 405, 94, 76);
      ctx.fillStyle = '#a4e4e9'; ctx.fillRect(374, 414, 72, 50);
      ctx.fillStyle = '#376782'; ctx.fillRect(389, 433, 7, 7); ctx.fillRect(426, 433, 7, 7);
      ctx.fillRect(398, 451, 25, 3);
      ctx.fillStyle = '#796680'; ctx.fillRect(383, 481, 8, 15); ctx.fillRect(435, 481, 8, 15);
    }
    ctx.restore();
  }

  function drawSelf(cx, groundY, saturation, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.translate(cx, 0); ctx.scale(-1, 1);
    ctx.filter = 'saturate(' + saturation + '%)';
    var rc = ryoseiSprite.anim.getRowCol();
    drawFrame(ryoseiFrames, rc.row, rc.col, 0, groundY, 0.75);
    ctx.restore();
  }
  function drawOpenDoor() {
    var glow = ctx.createRadialGradient(270, 350, 10, 270, 350, 230);
    glow.addColorStop(0, '#ffeab0'); glow.addColorStop(1, 'rgba(255,190,70,0)');
    ctx.fillStyle = glow; ctx.fillRect(20, 110, 500, 450);
    ctx.fillStyle = '#ffdf9a'; ctx.fillRect(235, 240, 90, 200);
    ctx.strokeStyle = '#a86b49'; ctx.lineWidth = 12; ctx.strokeRect(235, 240, 90, 200);
  }
  function drawEnemy(rc) {
    if (game.chapter === 1) { drawFrame(bugkingFrames, rc.row, rc.col, 270, 380, 0.85); return; }
    if (game.chapter === 4) {
      var merge = victoryFlashStart === null ? 0 : Math.min(1, (gameTime - victoryFlashStart) / 1800);
      drawSelf(270 - 130 * merge, 400 + 168 * merge, game.saturation, 1 - merge);
      return;
    }
    var frames = game.chapter === 2 ? kateinoFrames : hikakuFrames;
    if (frames[rc.row + '_' + rc.col]) {
      var frame = frames[rc.row + '_' + rc.col];
      drawFrame(frames, rc.row, rc.col, 270, game.chapter === 3 ? 500 : 440,
        Math.min(320 / frame.w, (game.chapter === 3 ? 210 : 230) / frame.h));
      if (game.chapter === 2 && game.battleOver) drawOpenDoor();
      return;
    }
    ctx.save();
    ctx.translate(Math.sin(elapsed * 3) * 3, game.chapter === 3 ? 65 : 0);
    if (game.chapter === 2) {
      ctx.fillStyle = '#8c7080'; ctx.fillRect(125, 245, 290, 195);
      ctx.strokeStyle = '#493346'; ctx.lineWidth = 5;
      for (var row = 0; row < 4; row++) {
        ctx.beginPath(); ctx.moveTo(125, 245 + row * 48); ctx.lineTo(415, 245 + row * 48); ctx.stroke();
        for (var col = 0; col < 4; col++) ctx.strokeRect(125 + col * 73, 245 + row * 48, 73, 48);
      }
      ctx.fillStyle = '#302439'; ctx.fillRect(238, 338, 64, 102);
      ctx.fillStyle = '#ffdf9a'; ctx.fillRect(178, 284, 44, 20); ctx.fillRect(318, 284, 44, 20);
      if (game.wallTurns > 0) {
        ctx.strokeStyle = '#ffe3a0'; ctx.beginPath(); ctx.moveTo(270, 245); ctx.lineTo(249, 286);
        ctx.lineTo(281, 319); ctx.lineTo(266, 356); ctx.stroke();
      }
      if (game.battleOver) drawOpenDoor();
    } else {
      ctx.fillStyle = '#7737a0'; ctx.beginPath(); ctx.moveTo(270, 270); ctx.lineTo(135, 440); ctx.lineTo(405, 440); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b6b0cf'; ctx.fillRect(215, 260, 110, 100);
      ctx.fillStyle = '#efc349'; ctx.beginPath(); ctx.moveTo(210, 265); ctx.lineTo(195, 218); ctx.lineTo(245, 240);
      ctx.lineTo(270, 205); ctx.lineTo(295, 240); ctx.lineTo(345, 218); ctx.lineTo(330, 265); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#251230'; ctx.fillRect(231, 296, 25, 12); ctx.fillRect(284, 296, 25, 12);
      ctx.fillStyle = '#ffe578'; ctx.font = '28px system-ui'; ctx.fillText('100000', 100, 350); ctx.fillText('No.1', 355, 390);
    }
    ctx.restore();
  }

  function drawVictoryFlash(elapsedMs) {
    var te = elapsedMs / 1000;
    if (te < 0.5) {
      ctx.fillStyle = 'rgba(220,240,255,' + Math.min(1, te / 0.5) + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else if (te < 0.9) {
      ctx.fillStyle = 'rgba(220,240,255,1)';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else if (te < 1.7) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, (te - 0.9) / 0.8) + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    }
  }

  function drawEndingGlow(elapsedMs) {
    var te = Math.min(1, elapsedMs / 3000);
    var r = 40 + te * 900;
    var alpha = 0.5 * (1 - te * 0.6);
    var grad = ctx.createRadialGradient(340, 470, 0, 340, 470, r);
    grad.addColorStop(0, 'rgba(200,230,255,' + Math.max(0, alpha) + ')');
    grad.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  function drawNightRoom(t) {
    ctx.fillStyle = '#141026';
    ctx.fillRect(0, 0, LOGICAL_W, 560);
    ctx.fillStyle = '#0a0820';
    ctx.fillRect(0, 560, LOGICAL_W, LOGICAL_H - 560);
    // 窓
    ctx.fillStyle = '#0c1230';
    ctx.fillRect(360, 60, 120, 160);
    ctx.strokeStyle = '#3a3a66'; ctx.lineWidth = 6;
    ctx.strokeRect(360, 60, 120, 160);
    ctx.beginPath();
    ctx.moveTo(420, 60); ctx.lineTo(420, 220);
    ctx.moveTo(360, 140); ctx.lineTo(480, 140);
    ctx.stroke();
    // 月
    ctx.fillStyle = '#eef3ff';
    ctx.beginPath(); ctx.arc(420, 108, 20, 0, Math.PI * 2); ctx.fill();
    // 壁の質感
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 2;
    for (var i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, 90 + i * 80); ctx.lineTo(LOGICAL_W, 90 + i * 80); ctx.stroke(); }
    // RYOSEI（小さめ）
    ryoseiSprite.anim.play('idle'); ryoseiSprite.anim.update(1 / 60);
    var rc = ryoseiSprite.anim.getRowCol();
    drawFrame(ryoseiFrames, rc.row, rc.col, 220, 560, 0.62);
    // 光るスマホ（手もとで光る・顔にはかからない位置）
    ctx.save();
    ctx.shadowColor = 'rgba(120,210,255,0.9)'; ctx.shadowBlur = 26;
    ctx.fillStyle = '#cdeeff';
    ctx.fillRect(240, 500, 30, 52);
    ctx.restore();
    // ソラ（脈打つ光の円）
    drawSora(340, 470, 30, t);
  }

  function drawBattleBg() {
    var grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    grad.addColorStop(0, '#1a1040');
    grad.addColorStop(1, '#2a1a4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  function drawAdvArt(kind, t) {
    var grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    grad.addColorStop(0, '#1a1040');
    grad.addColorStop(1, '#2a1a4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    if (kind === 'ryosei') {
      ryoseiSprite.anim.play('idle');
      ryoseiSprite.anim.update(1 / 60);
      var rc = ryoseiSprite.anim.getRowCol();
      drawFrame(ryoseiFrames, rc.row, rc.col, LOGICAL_W / 2, 480, 1.3);
    } else if (kind === 'sora') {
      drawSora(LOGICAL_W / 2, 320, 70, t);
    } else if (kind === 'boss') {
      bossSprite.anim.play('idle');
      bossSprite.anim.update(1 / 60);
      var bc = bossSprite.anim.getRowCol();
      drawFrame(bugkingFrames, bc.row, bc.col, LOGICAL_W / 2, 480, 1.1);
    }
  }

  // ============ デバッグAPI（自動検証用） ============
  game.command = doCommand;
  game.gotoTitle = gotoTitle;
  game.debugWin = function () {
    if (paused || game.screen !== 'battle' || game.battleOver) return;
    scheduled = [];
    if (game.chapter === 4) { game.createCount = 3; game.saturation = 100; }
    else { game.boss.hp = game.boss.displayHp = game.boss.rollTarget = 0; game.boss.rolling = false; checkBossBurst(); }
    onBossZero();
  };
  boot();
})();
</script>
</body>
</html>
