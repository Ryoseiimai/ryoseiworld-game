<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RYOSEIWORLD RPG - BUG KING</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#1a1040">
<style>
  html, body {
    margin: 0; padding: 0; background: #000; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', system-ui, -apple-system, sans-serif;
    height: 100%; width: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #outer {
    position: fixed; inset: 0;
    background: #000;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 540px; height: 960px;
    transform-origin: 0 0;
    background: #0c0820;
    overflow: hidden;
  }
  canvas#game {
    position: absolute; top: 0; left: 0;
    width: 540px; height: 960px;
    image-rendering: pixelated;
  }
  .screen {
    position: absolute; inset: 0;
    display: none;
  }
  .screen.active { display: block; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #6cf; font-size: 20px; letter-spacing: 2px; background: #000;
    z-index: 50;
  }

  /* タイトル */
  #screen-title { display: none; align-items: center; justify-content: center; flex-direction: column; }
  #screen-title.active { display: flex; }
  .title-logo { font-size: 52px; font-weight: bold; letter-spacing: 3px; color: #fff; text-shadow: 0 0 18px #5cf; }
  .title-sub { margin-top: 60px; font-size: 26px; color: #6cf; }
  .blink { animation: blink 1.1s infinite; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0.15;} }

  /* 会話シーン共通 */
  .adv-art { position: absolute; top: 60px; left: 0; width: 540px; height: 560px; }
  .speaker-name {
    position: absolute; left: 24px; top: 636px;
    font-size: 22px; color: #6cf; font-weight: bold;
  }
  .dialogue-box {
    position: absolute; left: 20px; right: 20px; bottom: 40px;
    min-height: 190px;
    background: rgba(6,4,20,0.92);
    border: 3px solid #6cf;
    border-radius: 10px;
    padding: 24px 22px;
    box-sizing: border-box;
    font-size: 26px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .tap-hint {
    position: absolute; right: 30px; bottom: 52px;
    font-size: 22px; color: #6cf;
  }

  /* 命名 */
  #screen-naming { align-items: center; justify-content: center; flex-direction: column; }
  #screen-naming.active { display: flex; }
  .naming-label { font-size: 26px; margin-bottom: 30px; line-height: 1.7; text-align: center; }
  #name-input {
    font-size: 30px; padding: 12px 18px; width: 260px; text-align: center;
    background: #10142a; color: #fff; border: 3px solid #6cf; border-radius: 8px;
  }
  .name-confirm-btn {
    margin-top: 34px; font-size: 26px; padding: 14px 40px;
    background: #6cf; color: #0c0820; border: none; border-radius: 8px; font-weight: bold;
  }

  /* 戦闘 */
  #screen-battle.active { display: block; }
  .hp-panel {
    position: absolute; background: rgba(6,4,20,0.85); border: 2px solid #6cf; border-radius: 8px;
    padding: 8px 14px; font-size: 22px; line-height: 1.5;
  }
  #hp-boss { top: 44px; left: 20px; }
  #hp-ryosei { top: 560px; right: 20px; }
  #battle-log {
    position: absolute; left: 20px; right: 20px; top: 648px; height: 92px;
    background: rgba(6,4,20,0.92); border: 3px solid #6cf; border-radius: 10px;
    padding: 12px 18px; box-sizing: border-box; font-size: 22px; line-height: 1.4; white-space: pre-wrap;
    overflow: hidden;
  }
  #command-menu {
    position: absolute; left: 20px; right: 20px; bottom: 20px; height: 190px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8px;
  }
  .cmd-btn {
    font-size: 26px; background: #10142a; color: #fff; border: 3px solid #6cf; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .cmd-btn.disabled { color: #444; border-color: #333; }
  .burst-text {
    position: absolute; left: 0; right: 0; top: 300px; text-align: center;
    font-size: 26px; color: #ff6; text-shadow: 0 0 10px #ff0, 2px 2px 0 #000;
    padding: 0 30px; opacity: 0; pointer-events: none; line-height: 1.5;
  }
  .burst-text.show { opacity: 1; transition: opacity 0.15s; }
  .burst-text.hide { opacity: 0; transition: opacity 0.6s; }

  #screen-epilogue.active { display: block; }
  #epilogue-speaker { top: 590px; }
  #epilogue-box { min-height: 250px; }
  .answer-row { display: flex; gap: 10px; margin-top: 16px; }
  .answer-row input {
    flex: 1; font-size: 22px; padding: 10px 12px;
    background: #10142a; color: #fff; border: 2px solid #6cf; border-radius: 6px;
  }
  .answer-row button {
    font-size: 22px; padding: 10px 20px; background: #6cf; color: #0c0820;
    border: none; border-radius: 6px; font-weight: bold;
  }
</style>
</head>
<body>
<div id="outer">
  <div id="stage">
    <canvas id="game" width="540" height="960"></canvas>

    <div id="screen-title" class="screen active">
      <div class="title-logo">RYOSEIWORLD</div>
      <div class="title-sub blink">TAP TO START</div>
    </div>

    <div id="screen-prologue" class="screen">
      <div class="speaker-name" id="prologue-speaker"></div>
      <div class="dialogue-box" id="prologue-text"></div>
      <div class="tap-hint">▶</div>
    </div>

    <div id="screen-naming" class="screen">
      <div class="naming-label">あおい ひかりが&#10;なまえを きいている&#10;なまえを つけてあげよう</div>
      <input id="name-input" type="text" maxlength="6" value="ソラ">
      <button class="name-confirm-btn" id="naming-confirm">けってい</button>
    </div>

    <div id="screen-battle" class="screen">
      <div class="hp-panel" id="hp-boss">BUG KING&#10;HP <span id="boss-hp-num">60</span> / 60</div>
      <div class="hp-panel" id="hp-ryosei"><span id="ryosei-name-label">RYOSEI</span>&#10;HP <span id="ryosei-hp-num">30</span> / 30</div>
      <div class="burst-text" id="burst-text"></div>
      <div id="battle-log">たたかいが はじまった!</div>
      <div id="command-menu">
        <div class="cmd-btn" data-cmd="tatakau">たたかう</div>
        <div class="cmd-btn" data-cmd="tsukuru">つくる</div>
        <div class="cmd-btn" data-cmd="naosu">なおす</div>
        <div class="cmd-btn" data-cmd="nigeru">にげる</div>
        <div class="cmd-btn disabled" data-cmd="shiraberu">しらべる</div>
        <div class="cmd-btn disabled" data-cmd="tsutaeru">つたえる</div>
      </div>
    </div>

    <div id="screen-epilogue" class="screen">
      <div class="speaker-name" id="epilogue-speaker"></div>
      <div class="dialogue-box" id="epilogue-box">
        <div id="epilogue-text"></div>
        <div class="answer-row" id="epilogue-answer-row" style="display:none;">
          <input id="epilogue-answer-input" type="text" maxlength="16" placeholder="こたえる">
          <button id="epilogue-answer-btn">こたえる</button>
        </div>
      </div>
      <div class="tap-hint" id="epilogue-tap-hint">▶</div>
    </div>
  </div>
</div>
<div id="loading">LOADING...</div>

<script>
(function () {
  'use strict';

  // ============ 定数 ============
  var LOGICAL_W = 540, LOGICAL_H = 960;
  var RYOSEI_MAX_HP = 30;
  var BUGKING_MAX_HP = 32;
  var ROLL_STEP = 0.045; // 1目盛りあたりの秒数

  // ============ 乱数（?seed= で再現可能） ============
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var qs = new URLSearchParams(location.search);
  var seedParam = qs.get('seed');
  var rand = seedParam !== null ? mulberry32(parseInt(seedParam, 10) || 1) : Math.random;
  function randInt(min, max) { return Math.floor(rand() * (max - min + 1)) + min; }

  // ============ ステージのフィット ============
  var stage = document.getElementById('stage');
  function resizeStage() {
    var availW = window.innerWidth, availH = window.innerHeight;
    var scale = Math.min(availW / LOGICAL_W, availH / LOGICAL_H);
    var offX = (availW - LOGICAL_W * scale) / 2;
    var offY = (availH - LOGICAL_H * scale) / 2;
    stage.style.transform = 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
  }
  window.addEventListener('resize', resizeStage);
  window.addEventListener('orientationchange', resizeStage);
  resizeStage();

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ============ アセット読み込み（index.htmlの方式を流用） ============
  var ryoseiFrames = {};
  var bugkingFrames = {};
  function loadFramesJson(dir, jsonFile, targetMap, cb) {
    fetch(dir + '/' + jsonFile).then(function (res) { return res.json(); }).then(function (list) {
      var count = list.length, done = 0;
      list.forEach(function (f) {
        var img = new Image();
        img.onload = function () { done++; if (done === count) cb(); };
        img.onerror = function () { done++; if (done === count) cb(); };
        img.src = dir + '/' + f.file;
        targetMap[f.row + '_' + f.col] = { img: img, w: f.w, h: f.h };
      });
      if (count === 0) cb();
    }).catch(function () { cb(); });
  }
  var loadedCount = 0;
  function onOneGroupLoaded() {
    loadedCount++;
    if (loadedCount === 2) {
      document.getElementById('loading').style.display = 'none';
      requestAnimationFrame(loop);
    }
  }
  loadFramesJson('assets/ryosei', 'ryosei_frames.json', ryoseiFrames, onOneGroupLoaded);
  loadFramesJson('assets/bugking', 'bugking_frames.json', bugkingFrames, onOneGroupLoaded);

  // ============ WebAudio 効果音 ============
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, type, gainVal, freqEnd) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal || 0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  var sfx = {
    decide: function () { playTone(560, 0.11, 'sine', 0.11, 780); },
    attack: function () { playTone(300, 0.12, 'sawtooth', 0.18, 100); },
    hurt: function () { playTone(140, 0.2, 'triangle', 0.22, 50); },
    heal: function () { playTone(500, 0.2, 'sine', 0.18, 800); },
    victory: function () {
      playTone(523, 0.15, 'square', 0.2);
      setTimeout(function () { playTone(659, 0.15, 'square', 0.2); }, 150);
      setTimeout(function () { playTone(784, 0.3, 'square', 0.2); }, 300);
    }
  };

  // ============ アニメ定義（index.htmlと同一シート） ============
  var RYOSEI_ANIM = {
    idle: { row: 0, cols: [0, 1, 2, 3], fps: 6, loop: true },
    hurt: { row: 3, cols: [0, 1], fps: 8, loop: false },
    magic: { row: 2, cols: [0, 1, 2, 3], fps: 12, loop: false }
  };
  var BUGKING_ANIM = {
    idle: { row: 0, cols: [0, 1, 2], fps: 5, loop: true },
    attack: { row: 1, cols: [0, 1, 2], fps: 8, loop: false },
    hurt: { row: 2, cols: [0, 1], fps: 8, loop: false },
    defeated: { row: 2, cols: [2], fps: 1, loop: false }
  };
  function AnimPlayer(defs) { this.defs = defs; this.current = null; this.frameIndex = 0; this.timer = 0; this.finished = false; }
  AnimPlayer.prototype.play = function (name, restart) {
    if (this.current === name && !restart) return;
    this.current = name; this.frameIndex = 0; this.timer = 0; this.finished = false;
  };
  AnimPlayer.prototype.update = function (dt) {
    var def = this.defs[this.current]; if (!def) return;
    this.timer += dt;
    var frameDur = 1 / def.fps;
    while (this.timer >= frameDur) {
      this.timer -= frameDur; this.frameIndex++;
      if (this.frameIndex >= def.cols.length) {
        if (def.loop) this.frameIndex = 0;
        else { this.frameIndex = def.cols.length - 1; this.finished = true; }
      }
    }
  };
  AnimPlayer.prototype.getRowCol = function () {
    var def = this.defs[this.current]; if (!def) return { row: 0, col: 0 };
    return { row: def.row, col: def.cols[this.frameIndex] };
  };
  function drawFrame(map, row, col, cx, groundY, scale) {
    var entry = map[row + '_' + col];
    if (!entry || !entry.img.complete) return;
    var w = entry.w * scale, h = entry.h * scale;
    ctx.drawImage(entry.img, cx - w / 2, groundY - h, w, h);
  }

  // ============ 画面管理 ============
  var screens = ['title', 'prologue', 'naming', 'battle', 'epilogue'];
  function showScreen(name) {
    screens.forEach(function (s) {
      document.getElementById('screen-' + s).classList.toggle('active', s === name);
    });
    game.screen = name;
  }

  // ============ デバッグ状態（外部公開） ============
  var game = {
    screen: 'title',
    prologueIndex: 0,
    epilogueIndex: 0,
    epilogueStage: 'panels',
    aiName: 'ソラ',
    log: [],
    ryosei: { hp: RYOSEI_MAX_HP, maxHp: RYOSEI_MAX_HP, displayHp: RYOSEI_MAX_HP, rollTarget: RYOSEI_MAX_HP, rolling: false, rollTimer: 0 },
    boss: { hp: BUGKING_MAX_HP, maxHp: BUGKING_MAX_HP, displayHp: BUGKING_MAX_HP, rollTarget: BUGKING_MAX_HP, rolling: false, rollTimer: 0, enraged: false, turnCount: 0 },
    burstShown: {},
    battleOver: false,
    playerLocked: false
  };
  window.__rpg = game;

  function pushLog(text) {
    document.getElementById('battle-log').textContent = text;
    game.log.push(text);
  }

  // ============ ドラムロール ============
  function startRoll(entity, newTrueHp) {
    entity.hp = Math.max(0, Math.min(entity.maxHp, newTrueHp));
    entity.rollTarget = entity.hp;
    entity.rolling = true;
    entity.rollTimer = 0;
  }
  function updateRoll(entity, dt, onZero) {
    if (!entity.rolling) return;
    entity.rollTimer += dt;
    while (entity.rollTimer >= ROLL_STEP && entity.displayHp !== entity.rollTarget) {
      entity.rollTimer -= ROLL_STEP;
      entity.displayHp += (entity.rollTarget > entity.displayHp ? 1 : -1);
      if (entity.displayHp === entity.rollTarget) {
        entity.rolling = false;
        if (entity.displayHp <= 0 && onZero) onZero();
      }
    }
  }
  // なおす（回復）：ロール中でも目標値を引き上げて助かる
  function healEntity(entity, amount) {
    var newTrue = Math.min(entity.maxHp, entity.hp + amount);
    entity.hp = newTrue;
    entity.rollTarget = newTrue;
    if (!entity.rolling) entity.displayHp = newTrue;
    else entity.rolling = true; // 目標を上書きして継続（表示は上向きに転がる）
  }

  ryosei_updateHpUi();
  function ryosei_updateHpUi() {}

  // ============ 文字送り（タイプライター・20文字/秒） ============
  var TYPE_SPEED = 20;
  var typewriter = { el: null, text: '', idx: 0, timer: 0, active: false, done: true, onDone: null };
  function startTypewriter(el, text, onDone) {
    typewriter.el = el; typewriter.text = text; typewriter.idx = 0; typewriter.timer = 0;
    typewriter.active = true; typewriter.done = false; typewriter.onDone = onDone || null;
    el.textContent = '';
  }
  function updateTypewriter(dt) {
    if (!typewriter.active || typewriter.done) return;
    typewriter.timer += dt;
    var step = 1 / TYPE_SPEED;
    while (typewriter.timer >= step && typewriter.idx < typewriter.text.length) {
      typewriter.timer -= step; typewriter.idx++;
      typewriter.el.textContent = typewriter.text.slice(0, typewriter.idx);
    }
    if (typewriter.idx >= typewriter.text.length && !typewriter.done) {
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
    }
  }
  function skipTypewriter() {
    if (typewriter.active && !typewriter.done) {
      typewriter.idx = typewriter.text.length;
      typewriter.el.textContent = typewriter.text;
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
      return true;
    }
    return false;
  }

  // ============ ソラの円描画 ============
  function drawSora(cx, cy, r, t) {
    var pulse = 1 + Math.sin(t * 3) * 0.08;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * pulse);
    grad.addColorStop(0, 'rgba(160,220,255,0.95)');
    grad.addColorStop(0.6, 'rgba(80,160,255,0.55)');
    grad.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2); ctx.fill();
  }

  // ============ プロローグ ============
  var PROLOGUE = [
    { speaker: '', text: 'がっこうでは とくに なにも ない。\nかえったら ゲーム。それだけ。', art: 'ryosei' },
    { speaker: 'ソラ', text: 'なにを つくる?', art: 'sora' },
    { speaker: 'BUG KING', text: 'どうせ お前には むりだ', art: 'boss' }
  ];
  var EPILOGUE = [
    { speaker: '', text: 'はじめて じぶんで\nひとつ うごくものを つくれる。' },
    { speaker: '', text: '少年は あいかわらず ゲームを している。\nちがうのは、それが じぶんの つくった ゲームだ ということ。' },
    { speaker: 'ソラ', text: 'つぎは なにを つくる?', triggersAnswer: true }
  ];

  function renderProlAdv(name, text, speakerId, textId) {
    document.getElementById(speakerId).textContent = name;
    startTypewriter(document.getElementById(textId), text);
  }

  function goPrologue() {
    game.prologueIndex = 0;
    showScreen('prologue');
    renderProlAdv(PROLOGUE[0].speaker, PROLOGUE[0].text, 'prologue-speaker', 'prologue-text');
  }
  document.getElementById('screen-prologue').addEventListener('click', function () {
    if (skipTypewriter()) { sfx.decide(); return; }
    sfx.decide();
    game.prologueIndex++;
    if (game.prologueIndex >= PROLOGUE.length) { goNaming(); return; }
    var p = PROLOGUE[game.prologueIndex];
    renderProlAdv(p.speaker, p.text, 'prologue-speaker', 'prologue-text');
  });

  document.getElementById('screen-title').addEventListener('click', function () {
    ensureAudio(); sfx.decide();
    goPrologue();
  });

  // ============ 命名 ============
  function goNaming() { showScreen('naming'); }
  document.getElementById('naming-confirm').addEventListener('click', function () {
    sfx.decide();
    var v = document.getElementById('name-input').value.trim();
    game.aiName = v.length > 0 ? v : 'ソラ';
    startBattle();
  });

  // ============ 戦闘 ============
  function resetBattle() {
    game.ryosei.hp = RYOSEI_MAX_HP; game.ryosei.displayHp = RYOSEI_MAX_HP; game.ryosei.rollTarget = RYOSEI_MAX_HP; game.ryosei.rolling = false;
    game.boss.hp = BUGKING_MAX_HP; game.boss.displayHp = BUGKING_MAX_HP; game.boss.rollTarget = BUGKING_MAX_HP; game.boss.rolling = false;
    game.boss.enraged = false; game.boss.turnCount = 0;
    game.burstShown = {};
    game.battleOver = false;
    game.playerLocked = false;
    document.getElementById('ryosei-name-label').textContent = game.aiName === 'ソラ' ? 'RYOSEI' : 'RYOSEI';
  }
  function startBattle() {
    resetBattle();
    showScreen('battle');
    pushLog('たたかいが はじまった!');
    ryoseiSprite.anim.play('idle');
    bossSprite.anim.play('idle');
  }

  var BOSS_BURSTS = { 45: '// あとで直す', 30: 'TODO: エラー処理', 15: 'とりあえず動いた', 0: 'いつか だれかの やくに たつはず' };
  function showBurst(text) {
    var el = document.getElementById('burst-text');
    el.textContent = text;
    el.classList.remove('hide'); el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); el.classList.add('hide'); }, 900);
  }
  function checkBossBurst() {
    [45, 30, 15, 0].forEach(function (th) {
      if (!game.burstShown[th] && game.boss.hp <= th) {
        game.burstShown[th] = true;
        showBurst(BOSS_BURSTS[th]);
      }
    });
  }

  function setCommandsEnabled(enabled) {
    game.playerLocked = !enabled;
  }

  function bossDamage(entity, dmg) {
    startRoll(entity, entity.hp - dmg);
    bossSprite.anim.play('hurt', true);
    sfx.attack();
    checkBossBurst();
  }
  function ryoseiDamage(dmg) {
    startRoll(game.ryosei, game.ryosei.hp - dmg);
    ryoseiSprite.anim.play('hurt', true);
    sfx.hurt();
  }

  function onRyoseiZero() {
    if (game.battleOver) return;
    game.battleOver = true;
    pushLog(game.aiName + ' が いくら つくっても\nまだ おわらない…\nもういちど!');
    setTimeout(function () { startBattle(); }, 1600);
  }
  var victoryFlashStart = null;
  function onBossZero() {
    if (game.battleOver) return;
    game.battleOver = true;
    setCommandsEnabled(false);
    bossSprite.anim.play('defeated');
    sfx.victory();
    pushLog('BUG KING を たおした!');
    victoryFlashStart = performance.now();
    setTimeout(function () { goEpilogue(); }, 2000);
  }

  function bossTurn() {
    if (game.battleOver) return;
    game.boss.turnCount++;
    if (!game.boss.enraged && game.boss.hp <= game.boss.maxHp / 2) {
      game.boss.enraged = true;
      pushLog('BUG KING は こわれかけている');
    }
    bossSprite.anim.play('attack', true);
    var special = (game.boss.turnCount % 3 === 0);
    var dmg;
    if (special) {
      dmg = randInt(8, 12) + (game.boss.enraged ? 3 : 0);
      pushLog('BUG KING は エラーを はきだした!\n' + dmg + ' の ダメージ!');
    } else {
      dmg = randInt(4, 7) + (game.boss.enraged ? 3 : 0);
      pushLog('BUG KING の こうげき!\n' + dmg + ' の ダメージ!');
    }
    ryoseiDamage(dmg);
    setCommandsEnabled(true);
  }

  function doCommand(cmd) {
    if (game.playerLocked || game.battleOver) return;
    if (cmd === 'shiraberu' || cmd === 'tsutaeru') return; // 1章では未実装
    sfx.decide();
    setCommandsEnabled(false);
    if (cmd === 'tatakau') {
      var dmg = randInt(4, 7);
      pushLog('たたかった!\n' + dmg + ' の ダメージ!');
      bossDamage(game.boss, dmg);
    } else if (cmd === 'tsukuru') {
      var miss = randInt(1, 5) === 1;
      if (miss) {
        pushLog(game.aiName + '「わかった。ちょっと まってて」\n' + game.aiName + 'が へんなものを つくった');
      } else {
        var d2 = randInt(12, 16);
        pushLog(game.aiName + '「わかった。ちょっと まってて」\n' + d2 + ' の ダメージ!');
        bossDamage(game.boss, d2);
      }
    } else if (cmd === 'naosu') {
      healEntity(game.ryosei, 12);
      ryoseiSprite.anim.play('magic', true);
      sfx.heal();
      pushLog('きずが 12 なおった!');
    } else if (cmd === 'nigeru') {
      pushLog('BUG KING が みちを ふさいでいる!');
    }
    setTimeout(function () {
      if (game.battleOver) return;
      if (game.boss.hp <= 0) { onBossZero(); return; }
      bossTurn();
    }, 700);
  }

  document.getElementById('command-menu').addEventListener('click', function (e) {
    var btn = e.target.closest('.cmd-btn');
    if (!btn) return;
    doCommand(btn.getAttribute('data-cmd'));
  });

  // ============ エピローグ ============
  var glowStart = null;
  function goEpilogue() {
    victoryFlashStart = null;
    game.epilogueIndex = 0;
    game.epilogueStage = 'panels';
    glowStart = null;
    document.getElementById('epilogue-answer-row').style.display = 'none';
    showScreen('epilogue');
    renderEpiloguePanel(0);
  }
  function renderEpiloguePanel(idx) {
    var p = EPILOGUE[idx];
    var speakerName = p.speaker === 'ソラ' ? game.aiName : p.speaker;
    document.getElementById('epilogue-speaker').textContent = speakerName;
    document.getElementById('epilogue-tap-hint').style.display = p.triggersAnswer ? 'none' : 'block';
    var onDone = p.triggersAnswer ? function () { enterAnswering(); } : null;
    startTypewriter(document.getElementById('epilogue-text'), p.text, onDone);
  }
  document.getElementById('screen-epilogue').addEventListener('click', function () {
    if (game.epilogueStage !== 'panels') return;
    if (skipTypewriter()) { sfx.decide(); return; }
    if (game.epilogueIndex >= EPILOGUE.length - 1) return; // 最後は自動で こたえる へ
    sfx.decide();
    game.epilogueIndex++;
    renderEpiloguePanel(game.epilogueIndex);
  });

  function enterAnswering() {
    game.epilogueStage = 'answering';
    document.getElementById('epilogue-answer-row').style.display = 'flex';
    document.getElementById('epilogue-answer-input').focus();
  }
  document.getElementById('epilogue-answer-btn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (game.epilogueStage !== 'answering') return;
    sfx.decide();
    document.getElementById('epilogue-answer-row').style.display = 'none';
    document.getElementById('epilogue-answer-input').value = '';
    game.epilogueStage = 'response';
    document.getElementById('epilogue-speaker').textContent = game.aiName;
    startTypewriter(document.getElementById('epilogue-text'), 'わかった。つくろう', function () {
      game.epilogueStage = 'glow';
      glowStart = performance.now();
      setTimeout(function () {
        game.epilogueStage = 'panels';
        showScreen('title');
      }, 3000);
    });
  });

  // ============ メインループ ============
  var ryoseiSprite = { anim: new AnimPlayer(RYOSEI_ANIM) };
  var bossSprite = { anim: new AnimPlayer(BUGKING_ANIM) };
  ryoseiSprite.anim.play('idle');
  bossSprite.anim.play('idle');

  var lastT = null, elapsed = 0;
  function loop(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t; elapsed += dt;

    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (game.screen === 'prologue') {
      updateTypewriter(dt);
      var p = PROLOGUE[game.prologueIndex];
      drawAdvArt(p.art, elapsed);
    } else if (game.screen === 'epilogue') {
      updateTypewriter(dt);
      drawNightRoom(elapsed);
      if (game.epilogueStage === 'glow' && glowStart !== null) {
        drawEndingGlow(performance.now() - glowStart);
      }
    } else if (game.screen === 'battle') {
      drawBattleBg();
      updateRoll(game.boss, dt, onBossZero);
      updateRoll(game.ryosei, dt, onRyoseiZero);
      ryoseiSprite.anim.update(dt);
      bossSprite.anim.update(dt);
      var bRc = bossSprite.anim.getRowCol();
      drawFrame(bugkingFrames, bRc.row, bRc.col, 270, 380, 0.85);
      var rRc = ryoseiSprite.anim.getRowCol();
      drawFrame(ryoseiFrames, rRc.row, rRc.col, 140, 640, 0.6);
      drawSora(320, 560, 26, elapsed);
      document.getElementById('boss-hp-num').textContent = Math.max(0, game.boss.displayHp);
      document.getElementById('ryosei-hp-num').textContent = Math.max(0, game.ryosei.displayHp);
      if (victoryFlashStart !== null) drawVictoryFlash(performance.now() - victoryFlashStart);
    }

    requestAnimationFrame(loop);
  }

  function drawVictoryFlash(elapsedMs) {
    var te = elapsedMs / 1000;
    if (te < 0.5) {
      ctx.fillStyle = 'rgba(220,240,255,' + Math.min(1, te / 0.5) + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else if (te < 0.9) {
      ctx.fillStyle = 'rgba(220,240,255,1)';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else if (te < 1.7) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, (te - 0.9) / 0.8) + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    } else {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    }
  }

  function drawEndingGlow(elapsedMs) {
    var te = Math.min(1, elapsedMs / 3000);
    var r = 40 + te * 900;
    var alpha = 0.5 * (1 - te * 0.6);
    var grad = ctx.createRadialGradient(340, 470, 0, 340, 470, r);
    grad.addColorStop(0, 'rgba(200,230,255,' + Math.max(0, alpha) + ')');
    grad.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  function drawNightRoom(t) {
    ctx.fillStyle = '#141026';
    ctx.fillRect(0, 0, LOGICAL_W, 560);
    ctx.fillStyle = '#0a0820';
    ctx.fillRect(0, 560, LOGICAL_W, LOGICAL_H - 560);
    // 窓
    ctx.fillStyle = '#0c1230';
    ctx.fillRect(360, 60, 120, 160);
    ctx.strokeStyle = '#3a3a66'; ctx.lineWidth = 6;
    ctx.strokeRect(360, 60, 120, 160);
    ctx.beginPath();
    ctx.moveTo(420, 60); ctx.lineTo(420, 220);
    ctx.moveTo(360, 140); ctx.lineTo(480, 140);
    ctx.stroke();
    // 月
    ctx.fillStyle = '#eef3ff';
    ctx.beginPath(); ctx.arc(420, 108, 20, 0, Math.PI * 2); ctx.fill();
    // 壁の質感
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 2;
    for (var i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, 90 + i * 80); ctx.lineTo(LOGICAL_W, 90 + i * 80); ctx.stroke(); }
    // RYOSEI（小さめ）
    ryoseiSprite.anim.play('idle'); ryoseiSprite.anim.update(1 / 60);
    var rc = ryoseiSprite.anim.getRowCol();
    drawFrame(ryoseiFrames, rc.row, rc.col, 220, 560, 0.62);
    // 光るスマホ（手もとで光る・顔にはかからない位置）
    ctx.save();
    ctx.shadowColor = 'rgba(120,210,255,0.9)'; ctx.shadowBlur = 26;
    ctx.fillStyle = '#cdeeff';
    ctx.fillRect(240, 500, 30, 52);
    ctx.restore();
    // ソラ（脈打つ光の円）
    drawSora(340, 470, 30, t);
  }

  function drawBattleBg() {
    var grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    grad.addColorStop(0, '#1a1040');
    grad.addColorStop(1, '#2a1a4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  function drawAdvArt(kind, t) {
    var grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    grad.addColorStop(0, '#1a1040');
    grad.addColorStop(1, '#2a1a4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    if (kind === 'ryosei') {
      ryoseiSprite.anim.play('idle');
      ryoseiSprite.anim.update(1 / 60);
      var rc = ryoseiSprite.anim.getRowCol();
      drawFrame(ryoseiFrames, rc.row, rc.col, LOGICAL_W / 2, 480, 1.3);
    } else if (kind === 'sora') {
      drawSora(LOGICAL_W / 2, 320, 70, t);
    } else if (kind === 'boss') {
      bossSprite.anim.play('idle');
      bossSprite.anim.update(1 / 60);
      var bc = bossSprite.anim.getRowCol();
      drawFrame(bugkingFrames, bc.row, bc.col, LOGICAL_W / 2, 480, 1.1);
    }
  }

  // ============ デバッグAPI（自動検証用） ============
  game.command = doCommand;
  game.gotoTitle = function () { showScreen('title'); };
})();
</script>
</body>
</html>
