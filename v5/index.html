<script>
(function(){'use strict';
const $=id=>document.getElementById(id), W=540,H=960,TILE=48,ROLL_STEP=.045;
  var platform = (function () {
    function readLocal(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; }
    }
    function writeLocal(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; }
    }
    if (window.ytgame) return createYouTubePlatform(window.ytgame, readLocal, writeLocal);
    var pauseCallbacks = [], resumeCallbacks = [];
    try {
      document.addEventListener('visibilitychange', function () {
        (document.hidden ? pauseCallbacks : resumeCallbacks).forEach(function (cb) {
          try { cb(); } catch (_) { /* A host callback must not stop the game. */ }
        });
      });
    } catch (_) {}
    return {
      save: async function (obj) { return writeLocal('ryoseiworld-rpg-v5', obj); },
      load: async function () { return readLocal('ryoseiworld-rpg-v5'); },
      whenActive: async function () {},
      onPause: function (cb) {
        pauseCallbacks.push(cb);
        try { if (document.hidden) queueMicrotask(cb); } catch (_) {}
      },
      onResume: function (cb) { resumeCallbacks.push(cb); },
      isAudioEnabled: function () { return true; },
      onAudioChange: function (cb) { try { cb(true); } catch (_) {} },
      firstFrameReady: function () {},
      gameReady: function () {}
    };
  })();
  function createYouTubePlatform(sdk, readLocal, writeLocal) {
    var hostPaused = false, loaded = false, loading = null, saving = false, pendingSave = null;
    var pauseCallbacks = [], resumeCallbacks = [], activeWaiters = [];
    var localNameKey = 'ryoseiworld-rpg-v5-ai-name';
    function whenActive() {
      return hostPaused ? new Promise(function (resolve) { activeWaiters.push(resolve); }) : Promise.resolve();
    }
    async function flushSave() {
      if (!loaded || hostPaused || saving || pendingSave === null) return;
      var data = pendingSave;
      pendingSave = null; saving = true;
      try { await sdk.game.saveData(data); }
      catch (_) {
        // Keep the latest checkpoint for the next milestone/resume; no retry loop.
        if (pendingSave === null) pendingSave = data;
        saving = false; return;
      }
      saving = false;
      flushSave();
    }
    // SDK mode deliberately never subscribes to visibilitychange.
    sdk.system.onPause(function () {
      hostPaused = true;
      pauseCallbacks.forEach(function (cb) { cb(); });
    });
    sdk.system.onResume(function () {
      hostPaused = false;
      resumeCallbacks.forEach(function (cb) { cb(); });
      activeWaiters.splice(0).forEach(function (resolve) { resolve(); });
      flushSave();
    });
    return {
      whenActive: whenActive,
      load: function () {
        if (!loading) loading = (async function () {
          await whenActive();
          var saved = null;
          try {
            var raw = await sdk.game.loadData();
            saved = raw ? JSON.parse(raw) : null;
            // Failed load/parse must never overwrite an existing cloud save.
            loaded = true;
          } catch (_) { loaded = false; }
          var name = readLocal(localNameKey);
          if (!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = { version: 1 };
          // Ignore any legacy cloud AI name; only the local value is used.
          saved.aiName = typeof name === 'string' ? name : 'ソラ';
          flushSave();
          return saved;
        })();
        return loading;
      },
      save: async function (obj, checkpoint) {
        writeLocal(localNameKey, obj.aiName);
        if (!checkpoint) return;
        // Explicit allowlist: user-entered strings never enter saveData.
        pendingSave = JSON.stringify({ version: 5, started: obj.started,
          chapter: obj.chapter, map: obj.map, x: obj.x, y: obj.y, dir: obj.dir,
          level: obj.level, exp: obj.exp, hp: obj.hp, battery: obj.battery,
          money: obj.money, items: obj.items, summons: obj.summons,
          bosses: obj.bosses, flags: obj.flags });
        await flushSave();
        return loaded && !hostPaused && pendingSave === null;
      },
      onPause: function (cb) { pauseCallbacks.push(cb); if (hostPaused) cb(); },
      onResume: function (cb) { resumeCallbacks.push(cb); },
      isAudioEnabled: function () { return sdk.system.isAudioEnabled(); },
      onAudioChange: function (cb) { sdk.system.onAudioEnabledChange(cb); },
      firstFrameReady: function () { sdk.game.firstFrameReady(); },
      gameReady: function () { sdk.game.gameReady(); }
    };
  }

  function startRoll(entity, newTrueHp) {
    entity.hp = Math.max(0, Math.min(entity.maxHp, newTrueHp));
    entity.rollTarget = entity.hp;
    entity.rolling = true;
    entity.rollTimer = 0;
  }
  function updateRoll(entity, dt, onZero) {
    if (!entity.rolling) return;
    entity.rollTimer += dt;
    while (entity.rollTimer >= ROLL_STEP && entity.displayHp !== entity.rollTarget) {
      entity.rollTimer -= ROLL_STEP;
      entity.displayHp += (entity.rollTarget > entity.displayHp ? 1 : -1);
      if (entity.displayHp === entity.rollTarget) {
        entity.rolling = false;
        if (entity.displayHp <= 0 && onZero) onZero();
      }
    }
  }
  // なおす（回復）：ロール中でも目標値を引き上げて助かる
  function healEntity(entity, amount) {
    var newTrue = Math.min(entity.maxHp, entity.hp + amount);
    entity.hp = newTrue;
    entity.rollTarget = newTrue;
    if (!entity.rolling) entity.displayHp = newTrue;
    else entity.rolling = entity.displayHp !== newTrue; // 目標を上書きして継続
  }

  var TYPE_SPEED = 20;
  var typewriter = { el: null, text: '', idx: 0, timer: 0, active: false, done: true, onDone: null };
  function startTypewriter(el, text, onDone) {
    typewriter.el = el; typewriter.text = text; typewriter.idx = 0; typewriter.timer = 0;
    typewriter.active = true; typewriter.done = false; typewriter.onDone = onDone || null;
    el.textContent = '';
  }
  function updateTypewriter(dt) {
    if (!typewriter.active || typewriter.done) return;
    typewriter.timer += dt;
    var step = 1 / TYPE_SPEED;
    while (typewriter.timer >= step && typewriter.idx < typewriter.text.length) {
      typewriter.timer -= step; typewriter.idx++;
      typewriter.el.textContent = typewriter.text.slice(0, typewriter.idx);
    }
    if (typewriter.idx >= typewriter.text.length && !typewriter.done) {
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
    }
  }
  function skipTypewriter() {
    if (typewriter.active && !typewriter.done) {
      typewriter.idx = typewriter.text.length;
      typewriter.el.textContent = typewriter.text;
      typewriter.done = true;
      var cb = typewriter.onDone; typewriter.onDone = null;
      if (cb) cb();
      return true;
    }
    return false;
  }

  var audioCtx = null, masterGain = null;
  function ensureAudio() {
    try {
      if (paused || !platform.isAudioEnabled()) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      syncAudio();
    } catch (_) {}
  }
  function playTone(freq, duration, type, gainVal, freqEnd) {
    // A game first opened muted may not have an AudioContext until a later tap.
    if (!audioCtx) ensureAudio();
    if (!audioCtx || paused || !platform.isAudioEnabled()) return;
    try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal || 0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (_) {}
  }
  var sfx = {
    decide: function () { playTone(560, 0.11, 'sine', 0.11, 780); },
    attack: function () { playTone(300, 0.12, 'sawtooth', 0.18, 100); },
    hurt: function () { playTone(140, 0.2, 'triangle', 0.22, 50); },
    heal: function () { playTone(500, 0.2, 'sine', 0.18, 800); },
    victory: function () {
      playTone(523, 0.15, 'square', 0.2);
      later(function () { playTone(659, 0.15, 'square', 0.2); }, 150);
      later(function () { playTone(784, 0.3, 'square', 0.2); }, 300);
    }
  };

$('start-btn').onclick=()=>{ensureAudio();newGame();};$('continue-btn').onclick=()=>{ensureAudio();restore();if(!g.flags.tutorial)startBattle('crow','tutorial',true);};$('naming-confirm').onclick=naming;$('ending-title').onclick=title;$('dialogue').onclick=advance;$('talk-btn').onclick=interact;$('menu-btn').onclick=()=>modalKind?closeModal():menu();$('commands').onclick=e=>{const b=e.target.closest('[data-cmd]');if(b)command(b.dataset.cmd);};

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();naming();}return;}const k=e.key.toLowerCase();if(e.target.tagName==='BUTTON'&&(k==='enter'||k===' '))return;if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','z','x','enter','escape',' '].includes(k))e.preventDefault();if(e.repeat)return;ensureAudio();if(k==='escape'||k==='x'){if(modalKind)closeModal();else menu();return;}if(k==='z'||k==='enter'){if(dialogue){advance();return;}if(modalKind){const selected=document.activeElement;if(selected&&$('modal-buttons').contains(selected))selected.click();else $('modal-buttons').querySelector('button:not(:disabled)')?.focus();return;}if(g.screen==='battle'){const selected=document.activeElement;if(selected&&$('commands').contains(selected))selected.click();else $('commands').querySelector('button:not(:disabled)')?.focus();return;}if(dialogue)advance();else if(g.screen==='field'&&!modalKind)interact();else if(g.screen==='title')newGame();return;}keys.add(k);});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();stick=null;});
function pointerPoint(e){const b=stage.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
stage.addEventListener('pointerdown',e=>{ensureAudio();if(g.screen!=='field'||dialogue||modalKind||e.target.closest('button,input'))return;const p=pointerPoint(e);stick={id:e.pointerId,x:p.x,y:p.y,dx:0,dy:0};stage.setPointerCapture(e.pointerId);});stage.addEventListener('pointermove',e=>{if(!stick||stick.id!==e.pointerId)return;const p=pointerPoint(e);stick.dx=Math.max(-1,Math.min(1,(p.x-stick.x)/45));stick.dy=Math.max(-1,Math.min(1,(p.y-stick.y)/45));});for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,e=>{if(stick?.id===e.pointerId)stick=null;});
platform.onPause(()=>{hostPaused=true;syncPause();});platform.onResume(()=>{hostPaused=false;syncPause();});platform.onAudioChange(syncAudio);
const api={GAME_DATA,platform,get screen(){return g.screen;},get chapter(){return g.chapter;},get map(){return g.map;},get position(){return{x:g.x,y:g.y,dir:g.dir};},get level(){return g.level;},get hp(){return g.hero;},get battery(){return g.battery;},get summons(){return g.summons;},get battle(){return g.battle;},get state(){return g;},get paused(){return paused;},get assets(){return assetStatus;},get dialogue(){return dialogue;},get modal(){return modalKind;},debugWarp(map,x,y){if(paused||!GAME_DATA.maps[map])return;scheduled=[];dialogue=null;$('dialogue').hidden=true;g.battle=null;enterMap(map,x,y);screen('field');},debugWin(){if(paused||!g.battle)return;g.battle.usedSummon=true;g.battle.enemy.hp=g.battle.enemy.displayHp=0;win();},debugSetLevel(n){g.level=Math.max(1,Math.min(99,Math.floor(n)||1));g.hero=entity(60+(g.level-1)*12);},debugFace(dir){g.dir=dir;},debugDamage(n){startRoll(g.hero,g.hero.hp-n);},command,interact,advance,save:saveGame,reloadAssets:loadAssets,debugStartBattle:startBattle,debugBlocked:blocked};window.__v5=api;
(async()=>{await Promise.all([loadAssets(),platform.load().then(s=>{if(validSave(s))saved=s;})]);await platform.whenActive();title();$('loading').hidden=true;booted=true;scheduleFrame();})();
})();
